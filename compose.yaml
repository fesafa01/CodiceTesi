include:
  - ./observability/compose.yaml

services:
  app:
    image: codice-tesi:local
    build: .
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      APP_BACKEND_URL: http://backend:8001
      # Identità pubblica fittizia per il solo prototipo locale su sintetici.
      APP_BACKEND_TOKEN: ${APP_BACKEND_TOKEN:-demo-revisore}
      TELEMETRY_ENABLED: "true"
      TELEMETRY_ENDPOINT: http://otel-collector:4318
      TELEMETRY_PROJECT: tesi-dimissioni
      HARDWARE_ENABLED: ${HARDWARE_ENABLED:-true}
      HARDWARE_ENDPOINT: ${HARDWARE_ENDPOINT:-http://spark-413e.tail9c981a.ts.net:9401}
    volumes:
      - ./output:/app/output
      - ./experiments:/app/experiments:ro
    depends_on:
      backend:
        condition: service_healthy
      otel-collector:
        condition: service_started

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: clinico
      POSTGRES_USER: clinico
      # Credenziali del database di sviluppo locale.
      POSTGRES_PASSWORD: clinico_sintetico
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - clinical-db:/var/lib/postgresql/data
      - ./docker/postgres/01-reader.sql:/docker-entrypoint-initdb.d/01-reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinico -d clinico"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-admin:
    image: codice-tesi-backend:local
    build:
      context: .
      target: backend
    command: ["init"]
    volumes:
      - ../datasets_pubblici/synthea_dimissioni:/dataset:ro
    environment: &clinical-environment
      CLINICAL_DATABASE_URL: postgresql://clinico:clinico_sintetico@db:5432/clinico
      CLINICAL_HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  backend:
    image: codice-tesi-backend:local
    build:
      context: .
      target: backend
    init: true
    environment:
      <<: *clinical-environment
      CLINICAL_DATABASE_URL: postgresql://clinical_reader:lettura_sintetica@db:5432/clinico
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      backend-admin:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s


volumes:
  clinical-db:
    # Persistenza dello schema e degli eventuali dataset importati esplicitamente.
    name: codicetesi_clinical-db-v2
