services:
  app:
    image: codice-tesi:local
    build: .
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      APP_BACKEND_URL: http://backend:8001
      TELEMETRY_ENABLED: "true"
      TELEMETRY_ENDPOINT: http://otel-collector:4318
      TELEMETRY_PROJECT: tesi-dimissioni
    volumes:
      - ./output:/app/output
      - ./experiments:/app/experiments:ro
    depends_on:
      backend:
        condition: service_healthy
      otel-collector:
        condition: service_started

  phoenix-db:
    image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_DB: phoenix
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: phoenix_locale
    volumes:
      - phoenix-db:/var/lib/postgresql/data
    networks: [observability]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix -d phoenix"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-20.25.0
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://phoenix:phoenix_locale@phoenix-db:5432/phoenix
      PHOENIX_ENABLE_AUTH: "false"
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
      PHOENIX_WORKING_DIR: /tmp/phoenix
    ports:
      - "127.0.0.1:6006:6006"
    networks: [observability]
    depends_on:
      phoenix-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      GOMEMLIMIT: 192MiB
    volumes:
      - ./docker/observability/collector.yaml:/etc/otelcol/config.yaml:ro
      - otel-queue:/var/lib/otelcol
    ports:
      - "127.0.0.1:4318:4318"
    networks: [default, observability]
    depends_on:
      otel-storage-init:
        condition: service_completed_successfully
      phoenix:
        condition: service_healthy
    restart: unless-stopped

  otel-storage-init:
    image: busybox:1.37.0
    user: "0:0"
    network_mode: none
    command:
      - sh
      - -c
      - |
        mkdir -p /var/lib/otelcol/queue
        chown -R 10001:10001 /var/lib/otelcol
    volumes:
      - otel-queue:/var/lib/otelcol
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./docker/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [observability]
    depends_on: [otel-collector]
    restart: unless-stopped

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: clinico
      POSTGRES_USER: clinico
      # Credenziali del database di sviluppo locale.
      POSTGRES_PASSWORD: clinico_sintetico
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - clinical-db:/var/lib/postgresql/data
      - ./docker/postgres/01-reader.sql:/docker-entrypoint-initdb.d/01-reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinico -d clinico"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-admin:
    image: codice-tesi-backend:local
    build:
      context: .
      target: backend
    command: ["init"]
    volumes:
      - ../datasets_pubblici/synthea_dimissioni:/dataset:ro
    environment: &clinical-environment
      CLINICAL_DATABASE_URL: postgresql://clinico:clinico_sintetico@db:5432/clinico
      CLINICAL_HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  backend:
    image: codice-tesi-backend:local
    build:
      context: .
      target: backend
    init: true
    environment:
      <<: *clinical-environment
      CLINICAL_DATABASE_URL: postgresql://clinical_reader:lettura_sintetica@db:5432/clinico
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      backend-admin:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s


volumes:
  phoenix-db:
  otel-queue:
  prometheus-data:
  clinical-db:
    # Persistenza dello schema e degli eventuali dataset importati esplicitamente.
    name: codicetesi_clinical-db-v2

networks:
  observability: {}
