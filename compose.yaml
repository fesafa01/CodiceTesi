include:
  - ./observability/compose.yaml

services:
  app:
    image: codice-tesi:local
    # Il client CLI esegue una generazione e deve partire solo su richiesta.
    profiles: ["cli"]
    build: .
    init: true
    env_file:
      - path: .env
        required: false
      - path: var/mimic/access.env
        required: false
    environment:
      APP_BACKEND_URL: http://backend:8001
      TELEMETRY_ENABLED: "true"
      TELEMETRY_ENDPOINT: http://otel-collector:4318
      TELEMETRY_PROJECT: tesi-dimissioni
    volumes:
      - ./output:/app/output
      - ./experiments:/app/experiments:ro
    depends_on:
      backend:
        condition: service_healthy
      otel-collector:
        condition: service_started

  agent-api:
    image: codice-tesi-agent-api:local
    build:
      context: .
      target: agent-api
    init: true
    env_file:
      - path: .env
        required: false
      - path: var/mimic/access.env
        required: false
    environment:
      APP_BACKEND_URL: http://backend:8001
      TELEMETRY_ENABLED: "true"
      TELEMETRY_ENDPOINT: http://otel-collector:4318
      TELEMETRY_PROJECT: tesi-dimissioni
    volumes:
      - ./output:/app/output
    depends_on:
      backend:
        condition: service_healthy
      otel-collector:
        condition: service_started
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    image: codice-tesi-web:local
    build: ./web
    init: true
    env_file:
      - path: var/mimic/access.env
        required: false
    environment:
      APP_BACKEND_URL: http://backend:8001
      AGENT_API_URL: http://agent-api:8002
      REFERENCE_API_URL: http://reference-api:8001
    networks: [default, reference-review]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
      agent-api:
        condition: service_healthy
      reference-api:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "bun", "-e", "const token = process.env.APP_MIMIC_TOKEN; const headers = token ? {Authorization: 'Basic ' + btoa('mimic:' + token)} : {}; const r = await fetch('http://127.0.0.1:3000', {headers}); process.exit(r.ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:17-bookworm
    networks: [default, reference-review]
    environment:
      POSTGRES_DB: clinico
      POSTGRES_USER: clinico
      # Credenziali del database di sviluppo locale.
      POSTGRES_PASSWORD: clinico_sintetico
    volumes:
      - clinical-db:/var/lib/postgresql/data
      - ./docker/postgres/01-reader.sql:/docker-entrypoint-initdb.d/01-reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinico -d clinico"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-admin:
    image: codice-tesi-backend:local
    build:
      context: .
      target: backend
    command: ["init"]
    environment:
      CLINICAL_DATABASE_URL: postgresql://clinico:clinico_sintetico@db:5432/clinico
      CLINICAL_HOST: 0.0.0.0
      CLINICAL_REFERENCE_READER_PASSWORD: ${CLINICAL_REFERENCE_READER_PASSWORD:-lettura_riferimento_locale}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  backend:
    image: codice-tesi-backend:local
    build:
      context: .
      target: backend
    init: true
    env_file:
      - path: var/mimic/access.env
        required: false
    environment:
      CLINICAL_DATABASE_URL: postgresql://clinical_reader:lettura_sintetica@db:5432/clinico
      CLINICAL_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      backend-admin:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  reference-api:
    image: codice-tesi-backend:local
    init: true
    command: ["serve-reference"]
    env_file:
      - path: var/mimic/access.env
        required: false
    environment:
      CLINICAL_DATABASE_URL: postgresql://clinical_reference_reader:${CLINICAL_REFERENCE_READER_PASSWORD:-lettura_riferimento_locale}@db:5432/clinico
      CLINICAL_HOST: 0.0.0.0
    networks: [reference-review]
    depends_on:
      backend-admin:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  reference-review:
    internal: true

volumes:
  clinical-db:
    # Persistenza dello schema e degli eventuali dataset importati esplicitamente.
    name: codicetesi_clinical-db-v2
