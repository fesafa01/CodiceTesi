[project]
name = "codice-tesi"
version = "0.1.0"
description = "Prototipo di supporto documentale clinico con PydanticAI e modelli via Tailscale"
readme = "README.md"
authors = [
    { name = "Federico Bini" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.29.0",
    "pydantic>=2.14.1",
    "pydantic-ai-slim[openai]>=2.55.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
tesi-agent = "codice_tesi.cli:main"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
