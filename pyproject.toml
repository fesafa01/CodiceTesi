[project]
name = "codice-tesi"
version = "0.2.0"
description = "Prototipo di supporto documentale clinico con PydanticAI e modelli via Tailscale"
readme = "README.md"
authors = [
    { name = "Federico Bini" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.29.0",
    "pydantic>=2.14.1",
    "pydantic-ai-slim[openai]>=2.55.0",
    "pydantic-settings>=2.15.0",
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "tokenizers>=0.22,<1",
]

[project.scripts]
tesi-backend = "codice_tesi.backend.cli:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
backend = [
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "uvicorn>=0.30,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
# L'installazione non-editable deve seguire anche sorgenti e template, non solo i metadati.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "src/**/*.py" },
    { file = "src/**/*.json" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pillow>=12,<13",
    "ruff>=0.17.0",
]
