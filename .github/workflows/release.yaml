name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  validate:
    uses: ./.github/workflows/checks.yaml
    permissions:
      contents: read
  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify version and build a checked source archive
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          python3 scripts/check_distribution.py --ref HEAD --output "dist/CodiceTesi-$VERSION.zip"
      - name: Publish checked download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "CodiceTesi $GITHUB_REF_NAME" --notes "Applicazione Docker con interfaccia CAMPUS, backend e archivio delle prove. Dataset MIMIC, testi clinici, credenziali e pesi dei modelli sono esclusi. Requisiti e avvio nel README."
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --clobber
